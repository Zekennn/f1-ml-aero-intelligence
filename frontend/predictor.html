<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 2026 | Championship Predictor</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body { overflow: auto; }
        .predictor-grid { display: flex; flex-direction: column; gap: 10px; padding: 16px; max-width: 900px; margin: 0 auto; }
        .driver-card { background: var(--card-bg); border: 1px solid #2a2a2a; border-radius: 8px; padding: 14px 20px; display: flex; align-items: center; gap: 16px; }
        .driver-rank { font-family: 'Orbitron', sans-serif; font-size: 1.4rem; color: #555; width: 36px; text-align: center; flex-shrink: 0; }
        .driver-rank.top { color: var(--f1-red); }
        .driver-info { flex: 1; }
        .driver-name { font-family: 'Orbitron', sans-serif; font-size: 0.85rem; color: var(--text); margin-bottom: 4px; }
        .driver-team { font-size: 0.72rem; color: #888; }
        .driver-bar-wrap { flex: 2; }
        .driver-bar { height: 8px; border-radius: 4px; background: var(--f1-red); transition: width 0.8s ease; }
        .driver-prob { font-family: 'Orbitron', sans-serif; font-size: 1rem; color: var(--accent); width: 60px; text-align: right; flex-shrink: 0; }
        .page-title { font-family: 'Orbitron', sans-serif; font-size: 1rem; color: var(--f1-red); padding: 16px 16px 4px; max-width: 900px; margin: 0 auto; }
        .error-msg { color: #888; text-align: center; padding: 40px; font-size: 0.9rem; }
        .back-link { font-size: 0.75rem; color: #555; text-decoration: none; }
        .back-link:hover { color: var(--accent); }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="logo">2026 CHAMPIONSHIP PREDICTOR</div>
        <a href="/" class="back-link">&#8592; HOME</a>
    </div>
    <div class="page-title">DRIVERS CHAMPIONSHIP WIN PROBABILITY</div>
    <div class="predictor-grid" id="predictorGrid">
        <div class="error-msg">Loading predictions...</div>
    </div>
    <script>
        fetch('/api/drivers-champ')
            .then(r => r.json())
            .then(data => {
                const grid = document.getElementById('predictorGrid');
                if (data.error) { grid.innerHTML = `<div class="error-msg">${data.error}</div>`; return; }
                const maxProb = Math.max(...data.predictions.map(d => d.WinProbability));
                grid.innerHTML = data.predictions.map((d, i) => `
                    <div class="driver-card">
                        <div class="driver-rank ${i < 3 ? 'top' : ''}">${i + 1}</div>
                        <div class="driver-info">
                            <div class="driver-name">${d.Driver}</div>
                            <div class="driver-team">${d.CurrentTeam}</div>
                        </div>
                        <div class="driver-bar-wrap">
                            <div class="driver-bar" style="width:${(d.WinProbability / maxProb * 100).toFixed(1)}%"></div>
                        </div>
                        <div class="driver-prob">${d.WinProbability}%</div>
                    </div>
                `).join('');
            })
            .catch(() => {
                document.getElementById('predictorGrid').innerHTML = '<div class="error-msg">Could not load predictions. Run train_predictor.py first.</div>';
            });
    </script>
</body>
</html>
